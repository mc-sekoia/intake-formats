nasuni.audit.file.datasync:
  description: 'Datasync (no metadata) if true or full fsync if false.'
  name: nasuni.audit.file.datasync
  type: keyword

nasuni.audit.file.volume:
  description: 'The GUID of the volume being operated on'
  name: nasuni.audit.file.volume
  type: keyword

nasuni.audit.request.offset:
  description: 'The offset from the start of the file that the read or write used'
  name: nasuni.audit.request.offset
  type: keyword

nasuni.audit.request.protocol:
  description: 'The protocol used to access the resource'
  name: nasuni.audit.request.protocol
  type: keyword
nasuni.audit.request.operation:
  description: 'The operation used'
  name: nasuni.audit.request.operation
  type: keyword
nasuni.audit.file.shared_link_key:
  description: 'Unique identifier created when a shared link is created or available for the file.'
  name: nasuni.audit.file.shared_link_key
  type: keyword

nasuni.audit.ressource.name:
  description: 'Name of the share or export that the client used'
  name: nasuni.audit.ressource.name
  type: keyword

nasuni.audit.request.lenght:
  description: 'The client requested length of a read or write'
  name: nasuni.audit.request.lenght
  type: integer

nasuni.audit.file.is_dir:
  description: 'Indicates if this is a directory'
  name: nasuni.audit.file.is_dir
  type: boolean

nasuni.audit.file.old_path:
  description: 'File path as it was before modification'
  name: nasuni.audit.file.old_path
  type: keyword

nasuni.audit.file.new_path:
  description: 'New file path'
  name: nasuni.audit.file.new_path
  type: keyword
