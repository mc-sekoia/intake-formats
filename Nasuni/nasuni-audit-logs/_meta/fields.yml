file.changes.name:
  description: Name of the file including the extension, without the directory.
  name: file.changes.name
  type: keyword

file.changes.path:
  description: Full path to the file, including the file name. It should include the
    drive letter, when appropriate.
  name: file.changes.path
  type: keyword


nasuni.audit.file.datasync:
  description: Datasync (no metadata) if true or full fsync if false.
  name: nasuni.audit.file.datasync
  type: keyword

nasuni.audit.file.shared_link_key:
  description: Unique identifier created when a shared link is created or available
    for the file.
  name: nasuni.audit.file.shared_link_key
  type: keyword

nasuni.audit.file.owner.id:
  description: The uid of the file's owner.
  name: nasuni.audit.file.owner.id
  type: keyword

nasuni.audit.file.changes.owner.id:
  description: The uid that the file has been chowned to.
  name: nasuni.audit.file.changes.owner.id
  type: keyword

nasuni.audit.request.length:
  description: The client requested length of a read or write
  name: nasuni.audit.request.length
  type: long

nasuni.audit.request.offset:
  description: The offset from the start of the file that the read or write used
  name: nasuni.audit.request.offset
  type: keyword

nasuni.audit.request.operation:
  description: The Nasuni operation used
  name: nasuni.audit.request.operation
  type: keyword

nasuni.audit.request.protocol:
  description: The protocol used to access the resource
  name: nasuni.audit.request.protocol
  type: keyword

nasuni.audit.request.result:
  description: Result of the operation.
  name: nasuni.audit.request.result
  type: long

nasuni.audit.resource.name:
  description: Name of the share or export that the client used
  name: nasuni.audit.resource.name
  type: keyword

nasuni.audit.detection.infected_files.count:
  description: Number of infected files detected 
  name: nasuni.audit.detection.infected_files.count
  type: long

volume.id:
  description: The volume ID (UID) or Globally Unique Identifier (GUID).
  name: volume.id
  type: keyword

volume.name:
  description: The volume name.
  name: volume.name
  type: keyword
